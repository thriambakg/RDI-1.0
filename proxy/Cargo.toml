[package]
name = "rdi-mavlink-proxy"
version = "0.1.0"
edition = "2021"
description = "Low-latency MAVLink relay: WebSocket <-> UDP for PX4/Gazebo"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
