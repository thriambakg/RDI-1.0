# Quick Frontend Deployment
# For when you only want to deploy frontend changes without running full infrastructure pipeline

name: Quick Frontend Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_infrastructure_check:
        description: 'Skip infrastructure validation (faster deployment)'
        required: false
        default: false
        type: boolean

jobs:
  quick-frontend-deploy:
    name: 'Quick Frontend Deploy'
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: ${{ github.event.inputs.environment }}
      frontend_only: ${{ github.event.inputs.skip_infrastructure_check == 'true' }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
