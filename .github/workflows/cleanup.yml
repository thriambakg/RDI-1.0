name: Terraform Cleanup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to clean up'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      confirm_destroy:
        description: 'Type "DESTROY" to confirm'
        required: true
        type: string

env:
  TF_VERSION: '1.4.0'
  AWS_REGION: 'us-east-1'

jobs:
  terraform-destroy:
    name: 'Terraform Destroy'
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_destroy == 'DESTROY'

    environment: 
      name: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: terraform

    steps:
    - name: 'Checkout GitHub repository'
      uses: actions/checkout@v4

    - name: 'Configure AWS credentials'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 'Set up Terraform'
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: 'Terraform Init'
      run: |
        terraform init \
          -backend-config="backend-configs/${{ github.event.inputs.environment }}.tfbackend" \
          -upgrade

    - name: 'Terraform Plan Destroy'
      run: |
        if [ -f "terraform.auto.tfvars" ]; then
          terraform plan -destroy \
            -var="environment=${{ github.event.inputs.environment }}" \
            -out=tfplan-destroy
        elif [ -f "environments/${{ github.event.inputs.environment }}.tfvars" ]; then
          terraform plan -destroy \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var-file="environments/${{ github.event.inputs.environment }}.tfvars" \
            -out=tfplan-destroy
        else
          terraform plan -destroy \
            -var="environment=${{ github.event.inputs.environment }}" \
            -out=tfplan-destroy
        fi

    - name: 'Terraform Apply Destroy'
      run: terraform apply -auto-approve tfplan-destroy

    - name: 'Cleanup Summary'
      run: |
        echo "## Cleanup Complete - ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Destroyed Resources:" >> $GITHUB_STEP_SUMMARY
        echo "- All application infrastructure has been destroyed" >> $GITHUB_STEP_SUMMARY
        echo "- Terraform state has been updated" >> $GITHUB_STEP_SUMMARY
        echo "- Base infrastructure remains intact" >> $GITHUB_STEP_SUMMARY