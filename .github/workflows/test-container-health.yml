# Container Health Test Workflow
# Use this to manually test container health without full deployment
name: Test Container Health

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: cosine-cluster
  ECS_SERVICE: cosine-frontend-service

jobs:
  test-health:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check ECS Service Health
        env:
          ECS_CLUSTER: ${{ env.ECS_CLUSTER }}-${{ github.event.inputs.environment }}
          ECS_SERVICE: ${{ env.ECS_SERVICE }}-${{ github.event.inputs.environment }}
        run: |
          echo "🔍 Checking ECS service health..."
          
          # Get service details
          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query 'services[0].{serviceName:serviceName,status:status,runningCount:runningCount,desiredCount:desiredCount,pendingCount:pendingCount}' \
            --output table \
            --region $AWS_REGION
          
          # Get task details
          echo "📋 Getting task details..."
          TASK_ARNS=$(aws ecs list-tasks \
            --cluster $ECS_CLUSTER \
            --service-name $ECS_SERVICE \
            --query 'taskArns' \
            --output text \
            --region $AWS_REGION)
          
          if [ "$TASK_ARNS" != "None" ] && [ -n "$TASK_ARNS" ]; then
            echo "🔍 Task health details:"
            aws ecs describe-tasks \
              --cluster $ECS_CLUSTER \
              --tasks $TASK_ARNS \
              --query 'tasks[].{taskArn:taskArn,lastStatus:lastStatus,healthStatus:healthStatus,containers:containers[0].{name:name,lastStatus:lastStatus,healthStatus:healthStatus,reason:reason}}' \
              --output table \
              --region $AWS_REGION
            
            # Get recent task events
            echo "📋 Recent task events:"
            aws ecs describe-tasks \
              --cluster $ECS_CLUSTER \
              --tasks $TASK_ARNS \
              --include TAGS \
              --query 'tasks[0].{createdAt:createdAt,startedAt:startedAt,stoppedAt:stoppedAt,stoppedReason:stoppedReason}' \
              --output table \
              --region $AWS_REGION
          else
            echo "❌ No tasks found for service $ECS_SERVICE"
          fi

      - name: Check Target Group Health
        env:
          ECS_CLUSTER: ${{ env.ECS_CLUSTER }}-${{ github.event.inputs.environment }}
          ECS_SERVICE: ${{ env.ECS_SERVICE }}-${{ github.event.inputs.environment }}
        run: |
          echo "🔍 Checking ALB target group health..."
          
          # Get target group ARN from ECS service
          TARGET_GROUP_ARN=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query 'services[0].loadBalancers[0].targetGroupArn' \
            --output text \
            --region $AWS_REGION)
          
          if [ "$TARGET_GROUP_ARN" != "None" ] && [ -n "$TARGET_GROUP_ARN" ]; then
            echo "📋 Target group: $TARGET_GROUP_ARN"
            
            # Check target health
            echo "🏥 Target health status:"
            aws elbv2 describe-target-health \
              --target-group-arn $TARGET_GROUP_ARN \
              --query 'TargetHealthDescriptions[].{Target:Target.Id,Port:Target.Port,Health:TargetHealth.State,Reason:TargetHealth.Reason,Description:TargetHealth.Description}' \
              --output table \
              --region $AWS_REGION
            
            # Get target group attributes
            echo "⚙️ Target group configuration:"
            aws elbv2 describe-target-group-attributes \
              --target-group-arn $TARGET_GROUP_ARN \
              --query 'Attributes[?Key==`health_check_path` || Key==`health_check_port` || Key==`health_check_protocol` || Key==`health_check_interval_seconds` || Key==`health_check_timeout_seconds` || Key==`healthy_threshold_count` || Key==`unhealthy_threshold_count`].{Key:Key,Value:Value}' \
              --output table \
              --region $AWS_REGION
          else
            echo "❌ No target group found for service"
          fi
