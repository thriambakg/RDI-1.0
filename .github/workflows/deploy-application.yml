# Application Infrastructure Deployment
# Python + Terraform scans, then per-region deployment via reusable workflow

name: Deploy Application Infrastructure

on:
  push:
    branches:
      - main
      - prod
      - develop
      - staging
    paths:
      - 'terraform/**'
      - 'backend_app/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - prod
      - develop
      - staging
    paths:
      - 'terraform/**'
      - 'backend_app/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      destroy:
        description: 'Destroy infrastructure'
        required: false
        default: false
        type: boolean
      force_apply:
        description: 'Force terraform apply even if no changes detected'
        required: false
        default: false
        type: boolean

jobs:
  determine-environment:
    name: 'Determine Environment'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      regions: ${{ steps.env.outputs.regions }}
    steps:
      - name: Determine Environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/prod" ]; then
            ENV="production"
          elif [ "${{ github.ref }}" == "refs/heads/develop" ] || [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            ENV="staging"
          else
            echo "⚠️ Unknown branch: ${{ github.ref }} - defaulting to staging" >> $GITHUB_STEP_SUMMARY
            ENV="staging"
          fi
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          if [ "${ENV}" == "staging" ]; then
            echo 'regions=["us-east-2"]' >> $GITHUB_OUTPUT
          else
            echo 'regions=["eu-central-1","eu-west-2","eu-west-3"]' >> $GITHUB_OUTPUT
          fi

  python-security:
    name: 'Python Security (SAST / SCA / Secrets)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep pip-audit

      - name: Bandit (SAST)
        run: |
          echo "🔍 Running Bandit on backend_app/src..."
          bandit -r backend_app/src -f screen --severity-level medium 2>/dev/null || true
        continue-on-error: true

      - name: Semgrep (Python SAST)
        run: |
          echo "🔍 Running Semgrep Python rules..."
          semgrep scan --config=p/python --config=p/security-audit --error --no-git-ignore backend_app/src 2>/dev/null || \
          semgrep scan --config=auto --error --no-git-ignore backend_app/src 2>/dev/null || true
        continue-on-error: true

      - name: pip-audit (SCA)
        run: |
          echo "🔍 Scanning dependencies for known vulnerabilities..."
          FAILED=0
          REQ_COUNT=0
          while IFS= read -r -d '' req; do
            echo "--- $req ---"
            if echo "$req" | grep -q "Chat/requirements.txt"; then
              pip-audit -r "$req" --ignore-vuln GHSA-cfh3-3jmp-rvhc || FAILED=1
            else
              pip-audit -r "$req" || FAILED=1
            fi
            REQ_COUNT=$((REQ_COUNT + 1))
          done < <(find backend_app -name "requirements.txt" -type f -print0 2>/dev/null || true)
          if [ "$REQ_COUNT" -eq 0 ]; then
            echo "✅ No requirements.txt in backend_app. Skipping pip-audit."
            exit 0
          fi
          if [ "$FAILED" -eq 1 ]; then
            echo "❌ One or more requirements.txt have known vulnerabilities."
            exit 1
          fi
          echo "✅ No known vulnerabilities in scanned requirements."

      - name: Gitleaks (Secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  terraform-validate-and-scan:
    name: 'Terraform Validate & Scan'
    needs: [determine-environment, python-security]
    runs-on: ubuntu-latest
    outputs:
      validation_passed: ${{ steps.validate.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform
      - name: Terraform Init
        id: init
        run: |
          REGIONS='${{ needs.determine-environment.outputs.regions }}'
          FIRST_REGION=$(echo $REGIONS | jq -r '.[0]')
          if [ "$FIRST_REGION" != "null" ] && [ -n "$FIRST_REGION" ]; then
            BACKEND_CONFIG="${{ needs.determine-environment.outputs.environment }}-${FIRST_REGION}.tfbackend"
          else
            BACKEND_CONFIG="${{ needs.determine-environment.outputs.environment }}.tfbackend"
          fi
          terraform init -backend-config="backend-configs/${BACKEND_CONFIG}"
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform
      - name: TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - name: TFLint Analysis
        run: |
          tflint --init
          tflint --format compact
        working-directory: terraform
      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: terraform
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          tf-vars: terraform/environments/${{ needs.determine-environment.outputs.environment }}.auto.tfvars
          trivyignores: terraform/.trivyignore
        continue-on-error: true
      - name: Setup Terrascan
        run: |
          curl -L "$(curl -s https://api.github.com/repos/tenable/terrascan/releases/latest | grep -o -E "https://.+?_Linux_x86_64.tar.gz")" > terrascan.tar.gz
          tar -xf terrascan.tar.gz terrascan && rm terrascan.tar.gz
          sudo mv terrascan /usr/local/bin && chmod +x /usr/local/bin/terrascan
      - name: Terrascan IaC Scan
        run: |
          terrascan scan -i terraform -d terraform \
            --policy-type aws \
            --severity high \
            --verbose \
            --output human
        continue-on-error: true
      - name: Setup Semgrep
        run: pip install semgrep
      - name: Semgrep Security Scan
        run: |
          semgrep --config=auto --config=p/terraform --config=p/aws --error --strict --verbose terraform
        continue-on-error: true
      - name: Security Scan Summary
        run: |
          echo "## 🔒 Terraform Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **TFLint:** Static analysis completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Trivy:** Infrastructure security scan completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Terrascan:** Policy compliance scan completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Semgrep:** Code pattern analysis completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review the job logs above for detailed findings and remediation steps." >> $GITHUB_STEP_SUMMARY
      - name: Pass validation
        id: validate
        run: echo "passed=true" >> $GITHUB_OUTPUT

  deploy-application:
    name: Deploy ${{ matrix.region }}
    needs: [determine-environment, terraform-validate-and-scan]
    if: needs.terraform-validate-and-scan.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJson(needs.determine-environment.outputs.regions) }}
    uses: thriambakg/RDI-Pipelines/.github/workflows/terraform-reusable.yml@main
    with:
      terraform_directory: 'terraform'
      infrastructure_type: 'application'
      environment: ${{ needs.determine-environment.outputs.environment }}
      region: ${{ matrix.region }}
      destroy: ${{ github.event.inputs.destroy == 'true' }}
      force_apply: ${{ github.event.inputs.force_apply == 'true' }}
      base_infra_dependency: true
      has_lambda_layer: false
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deployment-summary:
    name: 'Deployment Summary'
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-application]
    if: always() && (needs.deploy-application.result == 'success' || needs.deploy-application.result == 'failure')
    steps:
      - name: Generate Summary
        run: |
          echo "## 🚀 Application Infrastructure Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Regions:** ${{ needs.determine-environment.outputs.regions }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ needs.deploy-application.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review the per-region jobs above for detailed apply results." >> $GITHUB_STEP_SUMMARY

  comment-pr:
    name: 'Comment on PR'
    runs-on: ubuntu-latest
    needs: [determine-environment, terraform-validate-and-scan, deploy-application]
    if: github.event_name == 'pull_request'
    steps:
      - name: Comment PR with Results
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## Application Infrastructure Plan - ${{ needs.determine-environment.outputs.environment }}

            Terraform plan generated and security scans completed.

            ### Summary:
            - **Environment:** ${{ needs.determine-environment.outputs.environment }}
            - **Regions:** ${{ needs.determine-environment.outputs.regions }}
            - **Infrastructure Type:** Application
            - **Base Infrastructure:** Required (depends on base infra)

            ### Security Scans:
            - **Python SAST:** Bandit + Semgrep
            - **Python SCA:** pip-audit (dependencies)
            - **Secrets:** Gitleaks
            - **TFLint / Trivy / Terrascan / Semgrep:** Terraform IaC security scans (run once)

            ### Next Steps:
            - Merge this PR to apply infrastructure changes
            - Monitor deployment in the Actions tab`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
