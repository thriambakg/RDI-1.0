# Deploy EC2 proxy/agent code only (no Terraform, no instance replacement).
# Builds binaries, uploads to S3, runs SSM to pull and restart on proxy and Wavelength instances.
# Use this when only src/proxy or src/agent code changes; main "Deploy Application Infrastructure"
# runs on infra paths only and does not trigger on these paths.

name: Deploy EC2 Code (Proxy & Agent)

on:
  push:
    branches:
      - main
      - prod
      - develop
      - staging
    paths:
      - 'src/proxy/**'
      - 'src/agent/**'
      - 'scripts/build-proxy.sh'
      - 'scripts/build-agent.sh'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  determine-environment:
    name: 'Determine Environment'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      regions: ${{ steps.env.outputs.regions }}
    steps:
      - name: Determine Environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.ref }}" == "refs/heads/prod" ]; then
            ENV="production"
          elif [ "${{ github.ref }}" == "refs/heads/develop" ] || [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            ENV="staging"
          else
            ENV="staging"
          fi
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          if [ "${ENV}" == "staging" ]; then
            echo 'regions=["us-east-1"]' >> $GITHUB_OUTPUT
          else
            echo 'regions=["eu-central-1","eu-west-2"]' >> $GITHUB_OUTPUT
          fi

  build:
    name: 'Build Proxy & Agent'
    needs: determine-environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build proxy
        run: |
          cd src/proxy && cargo build --release && ls -la target/release/rdi-proxy
      - name: Build agent
        run: |
          cd src/agent && cargo build --release && ls -la target/release/rdi-agent
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ec2-binaries-${{ needs.determine-environment.outputs.environment }}
          path: |
            src/proxy/target/release/rdi-proxy
            src/agent/target/release/rdi-agent
          retention-days: 1

  deploy-per-region:
    name: 'S3 + SSM deploy ${{ matrix.region }}'
    needs: [determine-environment, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJson(needs.determine-environment.outputs.regions) }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: ec2-binaries-${{ needs.determine-environment.outputs.environment }}
      - name: Place binaries for upload
        run: |
          mkdir -p src/proxy/target/release src/agent/target/release
          mv rdi-proxy src/proxy/target/release/ 2>/dev/null || true
          mv rdi-agent src/agent/target/release/ 2>/dev/null || true
          chmod +x src/proxy/target/release/rdi-proxy src/agent/target/release/rdi-agent
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"
      - name: Terraform Init (read state for outputs)
        run: |
          terraform init -backend-config="backend-configs/${{ needs.determine-environment.outputs.environment }}-${{ matrix.region }}.tfbackend"
        working-directory: terraform
      - name: Get instance IDs and upload to S3
        run: |
          PROXY_ID=$(cd terraform && terraform output -raw proxy_instance_id 2>/dev/null || true)
          WID=$(cd terraform && terraform output -raw wavelength_instance_id 2>/dev/null || true)
          BUCKET="rdi-proxy-artifacts-${{ needs.determine-environment.outputs.environment }}-${{ matrix.region }}"
          echo "proxy_instance_id=$PROXY_ID" >> $GITHUB_ENV
          echo "wavelength_instance_id=$WID" >> $GITHUB_ENV
          echo "bucket=$BUCKET" >> $GITHUB_ENV
          echo "skip_deploy=true" >> $GITHUB_ENV
          if [ -z "$PROXY_ID" ] || [ "$PROXY_ID" = "null" ]; then
            echo "No proxy instance in this region; skipping S3 upload and SSM."
            exit 0
          fi
          aws s3 cp src/proxy/target/release/rdi-proxy "s3://$BUCKET/proxy/rdi-proxy" --region ${{ matrix.region }}
          if [ -n "$WID" ] && [ "$WID" != "null" ]; then
            aws s3 cp src/agent/target/release/rdi-agent "s3://$BUCKET/agent/rdi-agent" --region ${{ matrix.region }}
          fi
          echo "skip_deploy=false" >> $GITHUB_ENV
      - name: SSM – restart proxy (pull from S3, restart)
        if: env.skip_deploy != 'true'
        run: |
          aws ssm send-command --region ${{ matrix.region }} --instance-ids "${{ env.proxy_instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["[ -x /opt/rdi-proxy/update-from-s3.sh ] && /opt/rdi-proxy/update-from-s3.sh || (pkill -f rdi-proxy || true; sleep 2; cd /opt/rdi-proxy && nohup ./rdi-proxy >> /var/log/rdi-proxy.log 2>&1 &)"]}' \
            --timeout-seconds 120 \
            --query "Command.CommandId" --output text
          echo "Proxy restart command sent."
      - name: SSM – update agent on Wavelength (pull from S3, restart)
        if: env.skip_deploy != 'true' && env.wavelength_instance_id != '' && env.wavelength_instance_id != 'null'
        run: |
          aws ssm send-command --region ${{ matrix.region }} --instance-ids "${{ env.wavelength_instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["[ -x /opt/rdi-agent/update-from-s3.sh ] && /opt/rdi-agent/update-from-s3.sh || (pkill -f rdi-agent || true; sleep 2; cd /opt/rdi-agent && nohup ./rdi-agent >> /var/log/rdi-agent.log 2>&1 &)"]}' \
            --timeout-seconds 120 \
            --query "Command.CommandId" --output text
          echo "Agent restart command sent."
      - name: Summary
        run: |
          echo "## Deploy EC2 code (${{ matrix.region }})" >> $GITHUB_STEP_SUMMARY
          echo "- Proxy instance: \`${{ env.proxy_instance_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Wavelength instance: \`${{ env.wavelength_instance_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Binaries uploaded to \`s3://${{ env.bucket }}/\`; SSM restart sent." >> $GITHUB_STEP_SUMMARY
