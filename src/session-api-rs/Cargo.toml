[package]
name = "rdi-session-api"
version = "0.1.0"
edition = "2021"
description = "Async Rust Session API for RDI - low-latency alternative to Lambda"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
aws-config = "1.4"
aws-sdk-dynamodb = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
